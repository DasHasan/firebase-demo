<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Firebase</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ffca28, #ff7043); color: #222;
    }
    main { background: rgba(255,255,255,.9); padding: 2rem 2.5rem; border-radius: 16px;
           text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.15); margin: 16px; }
    h1 { margin: 0 0 .5rem; }
    p { margin: .25rem 0; }
    small { color: #666; }
  </style>
</head>
<body>
  <main>
    <h1>👋 Hello World!</h1>
    <p>Diese Seite läuft auf <strong>Firebase Hosting</strong>.</p>
    <p>Deployed automatisch per GitHub Actions.</p>
    <small id="time"></small>
  </main>
  <script>
    document.getElementById('time').textContent = 'Geladen: ' + new Date().toLocaleString('de-DE');
  </script>
</body>
</html>
